{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h3>Add Case Diary</h3>

<form method="POST" enctype="multipart/form-data">

<label>Title</label>
<input name="title" class="form-control mb-3" required>

<label>Description</label>
<textarea name="description" class="form-control mb-3" required></textarea>

<label>Visibility</label>
<select name="visibility" class="form-control mb-3">
<option value="public">Public</option>
<option value="private">Private</option>
</select>

<label>Upload Files</label>
<input type="file" name="files" multiple class="form-control mb-2">

<label>
<input type="checkbox" name="allow_download" value="1" checked>
Allow Download
</label>

<button class="btn btn-primary">Create Diary</button>

</form>

</div>

{% endblock %}
