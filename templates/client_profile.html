{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h2>My Profile</h2>

<form method="POST">

<label>Name</label>
<input name="name" value="{{ user.name }}" class="form-control mb-3">

<label>Email</label>
<input value="{{ user.email }}" class="form-control mb-3" disabled>

<label>Phone</label>
<input name="phone" value="{{ client.phone }}" class="form-control mb-3">

<label>Address</label>
<textarea name="address" class="form-control mb-3">{{ client.address }}</textarea>

<button class="btn btn-primary">
Update Profile
</button>

</form>

</div>

{% endblock %}
