
{% extends "base.html" %}
{% set full_page = True %}

{% block content %}

<style>

.login-page{
    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?q=80&w=1920&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

.login-card{

    width:100%;
    max-width:450px;

    background:rgba(255,255,255,0.1);

    backdrop-filter:blur(14px);

    border-radius:24px;

    padding:40px;

    color:white;

    border:1px solid rgba(255,255,255,0.2);
}

.form-control{
    height:52px;
    border-radius:12px;
    margin-bottom:16px;
}

</style>

<div class="login-page">

<div class="login-card">

<h1 class="text-center fw-bold mb-2">
Lawyer Login
</h1>

<p class="text-center text-light mb-4">
Access your legal dashboard
</p>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST" autocomplete="off">

<input
class="form-control mb-2"
name="email"
placeholder="Email"
autocomplete="off"
required>

<input
class="form-control mb-2"
type="password"
name="password"
placeholder="Password"
autocomplete="new-password"
required>

<div class="text-end mb-3">
<a href="/forgot-password" class="text-white">
Forgot Password?
</a>
</div>

<button class="btn btn-success w-100">
Login
</button>

</form>

<div class="mt-4 text-center">

<p>New lawyer?</p>

<a href="/register_lawyer"
class="btn btn-outline-light w-100">
Create Account
</a>

</div>

</div>
</div>

{% endblock %}
