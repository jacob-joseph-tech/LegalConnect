{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 rounded-4 p-4">

                <h2 class="mb-4 text-center">
                    Update Case Status
                </h2>

                <form method="POST">

                    <label class="form-label fw-bold">
                        Select Status
                    </label>

                    <select
                        name="status"
                        class="form-select mb-4"
                    >

                        <option value="Open">
                            Open
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Closed">
                            Closed
                        </option>

                    </select>

                    <button
                        class="btn btn-dark w-100 py-2"
                    >
                        Update Status
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
