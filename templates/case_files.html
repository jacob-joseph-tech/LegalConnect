{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Case Files</h2>

        <a href="{{ url_for('lawyer_dashboard') }}"
           class="btn btn-outline-dark">
           Back
        </a>

    </div>

    {% if files %}

        <div class="row">

            {% for f in files %}

            <div class="col-md-6 mb-4">

                <div class="card shadow-sm border-0 rounded-4 p-3">

                    <h5 class="mb-2">
                        📄 {{ f.file_name }}
                    </h5>

                    <p class="text-muted mb-3">

                        Uploaded:
                        {{ f.uploaded_at }}

                    </p>

                    <a href="/uploads/{{ f.file_name }}"
                       target="_blank"
                       class="btn btn-dark">
                       Open File
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="card p-5 text-center shadow-sm rounded-4">

            <h4>No files uploaded yet</h4>

            <p class="text-muted">
                Case documents will appear here.
            </p>

        </div>

    {% endif %}

</div>

{% endblock %}
