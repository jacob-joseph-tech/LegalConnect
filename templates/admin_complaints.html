{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">User Complaints</h2>

{% for c in complaints %}
<div class="card p-4 mb-3">

<h5>{{ c.subject }}</h5>

<p><strong>User:</strong> {{ c.name }}</p>

<p>{{ c.message }}</p>

<p class="text-muted">
{{ c.created_at }}
</p>

<span class="badge
{% if c.status == 'Open' %}
bg-warning
{% else %}
bg-success
{% endif %}
">
{{ c.status }}
</span>

</div>
{% endfor %}

{% endblock %}
