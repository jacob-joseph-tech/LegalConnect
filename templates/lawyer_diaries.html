{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h3>Case Diaries</h3>

<form method="GET" class="mb-3">
<input type="hidden" name="lawyer_id" value="{{ request.view_args.lawyer_id }}">
<input name="search" class="form-control" placeholder="Search case diaries">
</form>

{% for d in diaries %}
<div class="card p-3 mb-3 shadow-sm">

<h5>{{ d.title }}</h5>

<p class="text-muted">{{ d.description[:100] }}...</p>

<p>⭐ {{ d.likes }} Likes</p>  <!-- ✅ INSIDE loop -->

<div class="d-flex gap-2">
<a href="/diary/{{ d.id }}" class="btn btn-dark btn-sm">View</a>
<a href="/like-diary/{{ d.id }}" class="btn btn-warning btn-sm">Like</a>
</div>

</div>
{% endfor %}

{% if not diaries %}
<p>No case diaries available.</p>
{% endif %}

</div>


{% endblock %}
